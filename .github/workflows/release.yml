name: Release to Maven Central & Gradle Plugin Portal

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (without leading "v")'
        required: false
        default: ''
      maven_central_only:
        description: 'Publish only to Maven Central'
        type: boolean
        default: false
      plugin_portal_only:
        description: 'Publish only to Gradle Plugin Portal (e.g. for resubmitting after approval)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: liberica

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug — list init scripts and Gradle user home
        run: |
          echo "=== ~/.gradle/init.d ==="
          ls -la ~/.gradle/init.d 2>/dev/null || echo "(no init.d)"
          echo "=== GRADLE_USER_HOME ==="
          echo "$GRADLE_USER_HOME"
          echo "=== init.gradle files ==="
          find / -name "init.gradle*" -type f 2>/dev/null | head -20
          echo "=== gradle.properties in user home ==="
          cat ~/.gradle/gradle.properties 2>/dev/null | head -20 || echo "(no gradle.properties)"

      - name: Debug — root project plugins
        run: |
          mkdir -p /tmp/dbg && cat > /tmp/dbg/init.gradle <<'EOF'
gradle.afterProject { p ->
  p.afterEvaluate {
    if (p.path == ':') {
      println("=== ROOT PROJECT '" + p.name + "' plugins ===")
      p.plugins.each { println("  " + it.class.name) }
      println("=== ROOT PROJECT tasks (publishing/plugin) ===")
      p.tasks.each { t ->
        if (t.name.contains('plugin') || t.name.contains('sign') || t.name.startsWith('publish') || t.name.contains('Staging')) {
          println("  task " + p.path + ':' + t.name)
        }
      }
    }
  }
}
EOF
          ./gradlew help --init-script /tmp/dbg/init.gradle -q 2>&1 | grep -E "===" | head -10

      - name: Import GPG key into keyring
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          printf '%b' "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSWORD" --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent

      - name: Publish to Maven Central and Gradle Plugin Portal
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          OVERRIDE="${{ github.event.inputs.version }}"
          MAVEN_CENTRAL_ONLY="${{ github.event.inputs.maven_central_only }}"
          PLUGIN_PORTAL_ONLY="${{ github.event.inputs.plugin_portal_only }}"
          VERSION_VALUE="${OVERRIDE:-${{ github.ref_name }}}"
          VERSION_VALUE="${VERSION_VALUE#v}"
          VERSION_FLAG="-Pversion=${VERSION_VALUE}"
          TASKS=""
          if [ "$PLUGIN_PORTAL_ONLY" != "true" ]; then
            TASKS="$TASKS publishToMavenCentral"
          fi
          if [ "$MAVEN_CENTRAL_ONLY" != "true" ]; then
            TASKS="$TASKS publishPlugins"
          fi
          if [ -z "$TASKS" ]; then
            echo "::error::Both maven_central_only and plugin_portal_only are true — nothing to do."
            exit 1
          fi
          echo "Running: ./gradlew $TASKS $VERSION_FLAG"
          ./gradlew clean $TASKS \
            $VERSION_FLAG \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername=${{ secrets.MAVEN_CENTRAL_USERNAME }} \
            -PmavenCentralPassword=${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Build kn-clang-cli uber-jar
        run: ./gradlew :kn-clang-cli:jar

      - name: Upload kn-clang-cli to GH Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "${TAG}" kn-clang-cli/build/libs/kn-clang-cli.jar \
            --clobber \
            --repo ${{ github.repository }} || true

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Creating GitHub Release for tag ${TAG}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            kn-clang-cli/build/libs/kn-clang-cli.jar
